name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build DisplayControlLab.sln -c Release -m:1
      - shell: pwsh
        run: |
          $p = Start-Process src/Controller/bin/Release/net8.0-windows/DisplayControl.Controller.exe -ArgumentList '--ui-test','temp/validation/ui' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content temp/validation/ui/ui-error.txt; throw 'UI tests failed' }
          & tests/Platform/bin/Release/net8.0-windows/DisplayControl.Platform.Tests.exe . temp/validation/platform
          if ($LASTEXITCODE -ne 0) { throw 'Platform tests failed' }
          ./build/package.ps1 -LiteOnly -PreviewOnly
          if ($LASTEXITCODE -ne 0) { throw 'Preview package failed' }
          [xml]$props = Get-Content Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          dotnet run --project tests/Updates/DisplayControl.Update.Tests.csproj -c Release -- . temp/validation/updates "temp/preview/DisplayControlLab-$version-Lite.zip" Lite
          if ($LASTEXITCODE -ne 0) { throw 'Update tests failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation
          path: temp/validation
